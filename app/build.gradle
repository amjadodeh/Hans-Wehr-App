plugins {
    id("com.android.application")
}

// Release signing is read from a properties file kept OUTSIDE the repository.
// Format of the file (see README):
//   storeFile=/absolute/path/to/hanswehr-release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystorePropertiesFile = file(System.getenv("HANSWEHR_KEYSTORE_PROPERTIES") ?: "${System.getProperty("user.home")}/keystores/hanswehr-release.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.amjadodeh.hanswehr"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.amjadodeh.hanswehr"
        minSdk = 23
        targetSdk = 36
        versionCode = 40
        versionName = "4.0"
    }

    signingConfigs {
        if (keystoreProperties.containsKey("storeFile")) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            // The app is tiny; the APK size comes from the bundled dictionary pages,
            // which shrinking cannot reduce. Keep it simple and debuggable.
            minifyEnabled = false
            shrinkResources = false
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Page images are PNGs, which AAPT already stores uncompressed; this keeps the
    // behaviour explicit so pages can be memory-mapped straight from the APK.
    androidResources {
        noCompress += ["png"]
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        resources.excludes += ["META-INF/*.version", "META-INF/LICENSE*", "META-INF/NOTICE*"]
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.8.0")
    implementation("androidx.core:core:1.19.1")
    implementation("androidx.activity:activity:1.13.0")
    implementation("androidx.drawerlayout:drawerlayout:1.2.0")
    implementation("androidx.viewpager:viewpager:1.1.0")
    implementation("androidx.preference:preference:1.2.1")
    implementation("com.github.bumptech.glide:glide:5.0.9")
    implementation("com.github.chrisbanes:PhotoView:2.3.0")
}
